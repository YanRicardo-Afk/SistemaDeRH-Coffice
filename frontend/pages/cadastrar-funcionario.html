<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Funcionário</title>
  <link rel="stylesheet" href="../css/cadastrar-funcionario.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/menu.css">
</head>
<body>
  <div id="menu"></div>
  <button id="btnVoltar" class="btn-voltar">
    ← Voltar
</button>
  <h1>Cadastrar Funcionário</h1>

  <form id="formFuncionario">
    <div class="form-grid">

      <!-- ── Dados Pessoais ── -->
      <span class="section-label">Dados Pessoais</span>

      <div class="field-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Ex: Pedro Carvalho" required>
      </div>

      <div class="field-group">
        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" placeholder="Ex: 26308" required>
      </div>

      <div class="field-group">
        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" required>
      </div>

      <div class="field-group">
        <label for="statusCivil">Estado Civil</label>
        <select id="statusCivil" required>
          <option value="">Selecione</option>
          <option value="Solteiro">Solteiro</option>
          <option value="Casado">Casado</option>
          <option value="Divorciado">Divorciado</option>
          <option value="Viúvo">Viúvo</option>
        </select>
      </div>

      <!-- ── Contato ── -->
      <span class="section-label">Contato</span>

      <div class="field-group full">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" required>
      </div>

      <div class="field-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="exemplo@empresa.com" required>
      </div>

      <div class="field-group">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" placeholder="(81) 9 0000-0000" required>
      </div>

      <!-- ── Dados Profissionais ── -->
      <span class="section-label">Dados Profissionais</span>

      <div class="field-group">
        <label for="cargo">Cargo</label>
        <input type="text" id="cargo" placeholder="Ex: Analista, Gerente…" required>
      </div>

      <div class="field-group">
        <label for="dataAdmissao">Data de Admissão</label>
        <input type="date" id="dataAdmissao" required>
      </div>

      <div class="field-group">
        <label for="dataFerias">Data de Férias <span style="font-weight:400;text-transform:none;font-size:0.75rem;">(opcional)</span></label>
        <input type="date" id="dataFerias">
      </div>

      <!-- ── Acesso ao sistema ── -->
      <span class="section-label">Acesso ao Sistema</span>

      <div class="field-group">
        <label for="perfil">Perfil de Acesso</label>
        <select id="perfil" required>
          <option value="funcionario">Funcionário</option>
          <option value="rh">RH</option>
        </select>
      </div>

      <div class="field-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 8 caracteres" required>
      </div>

    </div><!-- /form-grid -->

    <div class="form-footer">
      <button type="button" id="btnCancelar">Cancelar</button>

      <button type="submit"> Salvar </button>
    </div>

  </form>

  <p id="mensagem"></p>
  <script defer src="../js/navegacao.js"></script>
  <script defer src="../js/cadastrarFuncionario.js"></script>
  <script defer src="../js/carregarMenu.js"></script>
  <script defer src="../js/auth.js"></script>
</body>
</html>

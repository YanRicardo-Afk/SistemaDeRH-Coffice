<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Funcionário</title>
  <link rel="stylesheet" href="../css/cadastrar-funcionario.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/menu.css">
</head>
<body>
  <div id="menu"></div>
  <button id="btnVoltar" class="btn-voltar">
    ← Voltar
</button>
  <h1>Cadastrar Funcionário</h1>

  <form id="formFuncionario">
    <div class="form-grid">

      <!-- ── Dados Pessoais ── -->
      <span class="section-label">Dados Pessoais</span>

      <div class="field-group">
        <label for="nome">Nome Completo</label>
        <input
          type="text"
          id="nome"
          placeholder="Ex: Pedro Carvalho"
          required
          pattern="[A-Za-zÀ-ÖØ-öø-ÿ\s]+"
          title="O nome deve conter somente letras e espaços."
        >
        <span id="nomeErro" class="field-error"></span>
      </div>

      <div class="field-group">
        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" placeholder="Gerando..." readonly>
        <span class="field-hint">Gerada automaticamente pelo sistema</span>
      </div>

      <div class="field-group">
        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" required>
        <span id="dataNascimentoErro" class="field-error"></span>
      </div>

      <div class="field-group">
        <label for="statusCivil">Estado Civil</label>
        <select id="statusCivil" required>
          <option value="">Selecione</option>
          <option value="Solteiro">Solteiro</option>
          <option value="Casado">Casado</option>
          <option value="Divorciado">Divorciado</option>
          <option value="Viúvo">Viúvo</option>
        </select>
      </div>

      <!-- ── Contato ── -->
      <span class="section-label">Contato</span>

      <div class="field-group full">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" required>
      </div>

      <div class="field-group">
        <label for="email">E-mail</label>
        <div class="email-input">
          <input type="text" id="emailLocal" placeholder="ex: pedro.carvalho" autocomplete="off" required>
          <span class="email-dominio">@coffice.com</span>
        </div>
        <span class="field-hint" id="emailFeedback"></span>
      </div>

      <div class="field-group">
        <label for="telefone">Telefone</label>
        <input
          type="tel"
          id="telefone"
          placeholder="(81) 9 0000-0000"
          required
          inputmode="numeric"
          maxlength="11"
          pattern="[0-9]{10,11}"
          title="O telefone deve conter somente números."
        >
        <span id="telefoneErro" class="field-error"></span>
     </div>

      <!-- ── Dados Profissionais ── -->
      <span class="section-label">Dados Profissionais</span>

      <div class="field-group">
        <label for="cargo">Cargo</label>
        <select id="cargo" required>
          <option value="">Selecione</option>
          <option value="RH">RH</option>
          <option value="Analista">Analista</option>
          <option value="Gerente">Gerente</option>
          <option value="Desenvolvedor">Desenvolvedor</option>
          <option value="Jovem Aprendiz">Jovem Aprendiz</option>
          <option value="Auxiliar Administrativo">Auxiliar Administrativo</option>
          <option value="Atendente de Suporte / Helpdesk">Atendente de Suporte / Helpdesk</option>
          <option value="Analista de Vendas">Analista de Vendas</option>
          <option value="Executivo de Contas (Account Executive)">Executivo de Contas (Account Executive)</option>
          <option value="Desenvolvedor(a) de Software / Programador(a)">Desenvolvedor(a) de Software / Programador(a)</option>
          <option value="Analista de Qualidade (QA)">Analista de Qualidade (QA)</option>
          <option value="Analista de Recrutamento e Seleção">Analista de Recrutamento e Seleção</option>
          <option value="Especialista em Treinamento e Desenvolvimento">Especialista em Treinamento e Desenvolvimento</option>
          <option value="Coordenador(a) de Projetos">Coordenador(a) de Projetos</option>
          <option value="Gerente de Operações">Gerente de Operações</option>
        </select>
      </div>

      <div class="field-group">
        <label for="dataAdmissao">Data de Admissão</label>
        <input type="date" id="dataAdmissao" required>
      </div>

      <div class="field-group">
        <label for="dataFerias">Data de Férias <span style="font-weight:400;text-transform:none;font-size:0.75rem;">(opcional)</span></label>
        <input type="date" id="dataFerias">
      </div>

      <!-- ── Acesso ao sistema ── -->
      <span class="section-label">Acesso ao Sistema</span>

      <div class="field-group">
        <label for="perfil">Perfil de Acesso</label>
        <select id="perfil" required>
          <option value="funcionario">Funcionário</option>
          <option value="rh">RH</option>
        </select>
      </div>

      <div class="field-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          placeholder="Mínimo 6 caracteres"
          minlength="6"
          required
        >
        <span id="senhaErro" class="field-error"></span>
      </div>

    </div><!-- /form-grid -->

    <div class="form-footer">
      <button type="button" id="btnCancelar">Cancelar</button>

      <button type="submit"> Salvar </button>
    </div>

  </form>

  <p id="mensagem"></p>


<!-- Modal de cadastro realizado com sucesso -->
<div id="modalSucesso" class="modal-overlay">

  <div class="modal-sucesso">

    <div class="modal-icone">
      ✓
    </div>

    <h2>Cadastro realizado!</h2>

    <p id="mensagemSucesso">
      Funcionário cadastrado com sucesso!
    </p>

    <p class="modal-redirecionamento">
      Você será redirecionado para a lista de funcionários.
    </p>

  </div>

</div>

  <script defer src="../js/navegacao.js"></script>
  <script defer src="../js/cadastrarFuncionario.js"></script>
  <script defer src="../js/carregarMenu.js"></script>
  <script defer src="../js/auth.js"></script>
</body>
</html>

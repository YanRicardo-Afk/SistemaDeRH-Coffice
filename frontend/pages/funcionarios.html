<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/navbarSuperior.css">
    <link rel="stylesheet" href="../css/funcionarios.css">

    <script defer src="../js/auth.js"></script>
    <script defer src="../js/carregarMenu.js"></script>
    <script defer src="../js/carregarNavbarSuperior.js"></script>
    <script defer src="../js/funcionarios.js"></script>
</head>

<body>
<button id="btnMenuMobile">
    <img src="../assents/icons/menu.svg" alt="Menu">
</button>
    <div id="menu"></div>

    <div id="navbarSuperior"></div>

    <main class="layout-principal">

        <h1>Funcionários</h1>

        <!-- Barra de controles -->
        <div class="toolbar">

            <input
                type="text"
                id="pesquisaNome"
                placeholder="Pesquisar funcionário"
            >

            <button id="btnPesquisar">
                Pesquisar
            </button>

            <select id="filtroCargo">

                <option value="">Cargo ▾</option>
                <option value="RH">RH</option>
                <option value="Analista">Analista</option>
                <option value="Gerente">Gerente</option>
                <option value="Desenvolvedor">Desenvolvedor</option>
                <option value="Jovem Aprendiz">Jovem Aprendiz</option>
                <option value="Auxiliar Administrativo">Auxiliar Administrativo</option>
                <option value="Atendente de Suporte / Helpdesk">Atendente de Suporte / Helpdesk</option>
                <option value="Analista de Vendas">Analista de Vendas</option>
                <option value="Executivo de Contas (Account Executive)">Executivo de Contas (Account Executive)</option>
                <option value="Desenvolvedor(a) de Software / Programador(a)">Desenvolvedor(a) de Software / Programador(a)</option>
                <option value="Analista de Qualidade (QA)">Analista de Qualidade (QA)</option>
                <option value="Analista de Recrutamento e Seleção">Analista de Recrutamento e Seleção</option>
                <option value="Especialista em Treinamento e Desenvolvimento">Especialista em Treinamento e Desenvolvimento</option>
                <option value="Coordenador(a) de Projetos">Coordenador(a) de Projetos</option>
                <option value="Gerente de Operações">Gerente de Operações</option>
                <option value="">Selecione</option>

            </select>

            <button id="btnNovoFuncionario">
                + Cadastrar Novo
            </button>

        </div>

        <!-- Lista populada pelo JS -->
        <div id="listaFuncionarios"></div>

    </main>

</body>
</html>

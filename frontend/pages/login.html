<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Coffice</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <!-- Fundo desfocado (reflexo da tela de login) -->
  <div class="bg-blur" aria-hidden="true">
    <div class="bg-blur__card">
      <div class="bg-blur__left"></div>
      <div class="bg-blur__right"></div>
    </div>
  </div>

  <div class="login-card">

    <!-- ── Painel Esquerdo ── -->
    <div class="card-left">
      <!-- Logo Coffice -->
      <a href="#" class="logo">
        <img src="../assents/CoffeLogoCorrigida.svg" alt="Coffice">
      </a>

      <!-- Foto com bolinha decorativa atrás -->
      <div class="photo-area">
        <div class="photo-circle-bg"></div>
        <div class="photo-wrap">
          <img
            src="../assents/homem-de-negocios-proprietario-da-empresa-no-escritorio_1303-16046.avif"
            alt="Profissional no escritório">
        </div>
      </div>
    </div>

    <!-- ── Painel Direito ── -->
    <div class="card-right">
      <h2>Entrar</h2>

      <form id="loginForm">
        <div class="field-group">
          <label class="field-label" for="email">Email empresarial</label>
          <input type="email" id="email" placeholder="Digite seu email" required>
        </div>

        <div class="field-group">
          <label class="field-label" for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
          <a href="#" class="forgot-link">Esqueceu sua senha?</a>
        </div>

        <button type="submit">Entrar</button>
      </form>

      <p id="erro"></p>
    </div>

  </div>

  <script src="../js/login.js"></script>
</body>
</html>

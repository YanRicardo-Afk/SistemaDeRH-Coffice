<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Coffice</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/navbarSuperior.css">
    <link rel="stylesheet" href="../css/inicio.css">
    <link rel="stylesheet" href="../css/pontos-funcionario.css">

    <script defer src="../js/auth.js"></script>
    <script defer src="../js/carregarMenu.js"></script>
    <script defer src="../js/carregarNavbarSuperior.js"></script>
    <script defer src="../js/inicio.js"></script>

</head>

<body>

    <button id="btnMenuMobile">
    <img src="../assents/icons/menu.svg" alt="Menu">
</button>

    <div id="overlayMenu"></div>

    <div id="menu"></div>
    

    <div id="navbarSuperior"></div>

    <main class="layout-principal">

        <section class="cabecalho-inicio">

            <div>

                <h2 id="saudacao">Olá!</h2>

                <p class="subtitulo">
                    Bem-vindo ao sistema Coffice.
                </p>

            </div>

            <div class="relogio">

                <span id="horaAtual">--:--</span>

            </div>

        </section>

        <div class="conteudo-grid">

            <div class="coluna-esquerda">

                <section class="registro-hoje">

                    <h2>Registro de Hoje</h2>

                    <p class="data-hoje" id="dataHoje">
                        --/--/----
                    </p>

                    <div class="registro-item">

                        <span>Entrada</span>

                        <strong id="horaEntrada">
                            --:--
                        </strong>

                    </div>

                    <div class="registro-item">

                        <span>Saída</span>

                        <strong id="horaSaida">
                            --:--
                        </strong>

                    </div>

                </section>

                <div class="acoes-ponto">

                    <button id="btnRegistrarPonto">
                        Carregando...
                    </button>

                </div>

            </div>

            <section class="avisos">

                <h2 class="avisos-titulo">Avisos</h2>

                <div class="carrossel-avisos" id="carrosselAvisos">

                    <div class="carrossel-track" id="carrosselTrack">

                        <img
                            src="../assents/aviso2.jpeg"
                            alt="Aviso 1"
                            class="aviso-imagem"
                        >

                        <img
                            src="../assents/aviso.jpeg"
                            alt="Aviso 2"
                            class="aviso-imagem"
                        >

                    </div>

                    <button class="carrossel-seta seta-esquerda" id="setaEsquerda" aria-label="Aviso anterior">&#10094;</button>
                    <button class="carrossel-seta seta-direita" id="setaDireita" aria-label="Próximo aviso">&#10095;</button>

                    <div class="carrossel-dots" id="carrosselDots"></div>

                </div>

            </section>

        </div>

    </main>

<div class="modal-overlay" id="modalPonto">

    <div class="modal">

        <h2 id="tituloModal">
            Confirmar Registro
        </h2>

        <p class="texto-modal">

            Você irá registrar:

        </p>

        <h3 id="tipoRegistro">
            Entrada
        </h3>

        <div class="dados-modal">

            <p>

                <strong>Data:</strong>

                <span id="modalData"></span>

            </p>

            <p>

                <strong>Hora:</strong>

                <span id="modalHora"></span>

            </p>

        </div>
        <p id="mensagemModal" class="mensagem-modal"></p>
        <div class="acoes-modal">

            <button
                id="btnCancelarModal"
                class="btn-secundario">

                Cancelar

            </button>

            <button
                id="btnConfirmarModal"
                class="btn-principal">

                Confirmar

            </button>

        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastrarHolerite</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>
    <div id="menu"></div>
    <h1>Cadastrar Holerite</h1>

<form id="formHolerite">

<select id="funcionarioId" required>

    <option value="">
        Selecione um funcionário
    </option>

</select>

    <input
        type="text"
        id="descricao"
        placeholder="Descrição"
        required
    >

    <input
        type="number"
        step="0.01"
        id="salario"
        placeholder="Salário"
        required
    >

    <input
        type="number"
        step="0.01"
        id="inss"
        placeholder="INSS"
        required
    >

    <input
        type="number"
        step="0.01"
        id="onibus"
        placeholder="Ônibus Fretado"
        required
    >

    <input
        type="number"
        step="0.01"
        id="vale"
        placeholder="Vale Alimentação"
        required
    >

    <button type="submit">
        Salvar Holerite
    </button>

</form>

<p id="mensagem"></p>

<script src="../js/cadastrarHolerite.js"></script>
<script src="../js/carregarMenu.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionário</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/navbarSuperior.css">
    <link rel="stylesheet" href="../css/funcionario.css">

    <script defer src="../js/auth.js"></script>
    <script defer src="../js/carregarMenu.js"></script>
    <script defer src="../js/carregarNavbarSuperior.js"></script>
    <script defer src="../js/navegacao.js"></script>
    <script defer src="../js/funcionario.js"></script>
</head>

<body>
    <button id="btnMenuMobile">
    <img src="../assents/icons/menu.svg" alt="Menu">
</button>
    <div id="menu"></div>

    <div id="navbarSuperior"></div>

    <main class="layout-principal">

        <button id="btnVoltar" class="btn-voltar">
    ← Voltar
</button>
        <h1>Funcionário</h1>

        <p class="subtitulo">
            Visualize as informações cadastrais do colaborador.
        </p>

        <div class="cabecalho-funcionario">

    <div class="avatar-funcionario">

        <img
            src="../assents/icons/account_circle.svg"
            alt="Funcionário"
        >

    </div>

    <div class="info-funcionario">

        <h2 id="nomeCabecalho">
            Carregando...
        </h2>

        <p id="cargoCabecalho">
            Cargo
        </p>

    </div>

</div>

        <div class="card-funcionario">

    <div class="secao-card">

        <h3>Dados Pessoais</h3>

        <div class="grid-dados">

            <p>
                <strong>Matrícula</strong>
                <span id="matricula"></span>
            </p>

            <p>
                <strong>Nome</strong>
                <span id="nome"></span>
            </p>

            <p>
                <strong>Status Civil</strong>
                <span id="statusCivil"></span>
            </p>

            <p>
                <strong>Data de Nascimento</strong>
                <span id="dataNascimento"></span>
            </p>

        </div>

    </div>

    <div class="secao-card">

        <h3>Contato</h3>

        <div class="grid-dados">

            <p>
                <strong>Email</strong>
                <span id="email"></span>
            </p>

            <p>
                <strong>Telefone</strong>
                <span id="telefone"></span>
            </p>

            <p class="linha-inteira">
                <strong>Endereço</strong>
                <span id="endereco"></span>
            </p>

        </div>

    </div>

    <div class="secao-card">

        <h3>Dados Profissionais</h3>

        <div class="grid-dados">

            <p>
                <strong>Cargo</strong>
                <span id="cargo"></span>
            </p>

            <p>
                <strong>Perfil</strong>
                <span id="perfil"></span>
            </p>

            <p>
                <strong>Data de Admissão</strong>
                <span id="dataAdmissao"></span>
            </p>

            <p>
                <strong>Data de Férias</strong>
                <span id="dataFerias"></span>
            </p>

        </div>

    </div>

</div>

            <div class="btn-group">

                <button id="btnAdicionarHolerite">
                    + Adicionar Holerite
                </button>

                <button id="btnHolerites">
                    Ver Holerites
                </button>

                <button id="btnPontos">
                    Ver Pontos
                </button>

                <button id="btnEditar">
                    Editar
                </button>

            </div>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Funcionário</title>

    <link rel="stylesheet" href="../css/editar-funcionario.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/menu.css">

    
</head>

<body>

    <div id="menu"></div>

    <button id="btnVoltar" class="btn-voltar">
    ← Voltar
</button>

    <h1>Editar Funcionário</h1>

    <p class="subtitulo">
        Atualize as informações do colaborador.
    </p>

    <form id="formFuncionario">

        <div class="form-grid">

            <span class="section-label">
                Dados Pessoais
            </span>

            <div class="field-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="field-group">
                <label for="matricula">Matrícula</label>
                <input type="text" id="matricula" readonly>
                <span class="opcional">A matrícula não pode ser alterada</span>
            </div>

            <div class="field-group">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" id="dataNascimento" required>
            </div>

            <div class="field-group">
                <label for="statusCivil">Estado Civil</label>

                <select id="statusCivil" required>
                    <option value="">Selecione</option>
                    <option value="Solteiro">Solteiro</option>
                    <option value="Casado">Casado</option>
                    <option value="Divorciado">Divorciado</option>
                    <option value="Viúvo">Viúvo</option>
                </select>
            </div>

            <span class="section-label">
                Contato
            </span>

            <div class="field-group full">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" required>
            </div>

            <div class="field-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>

            <div class="field-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" required>
            </div>

            <span class="section-label">
                Dados Profissionais
            </span>

            <div class="field-group">
                <label for="cargo">Cargo</label>
                <select id="cargo" required>
                    <option value="">Selecione</option>
                    <option value="Auxiliar Administrativo">Auxiliar Administrativo</option>
                    <option value="Atendente de Suporte / Helpdesk">Atendente de Suporte / Helpdesk</option>
                    <option value="Analista de Vendas">Analista de Vendas</option>
                    <option value="Executivo de Contas (Account Executive)">Executivo de Contas (Account Executive)</option>
                    <option value="Desenvolvedor(a) de Software / Programador(a)">Desenvolvedor(a) de Software / Programador(a)</option>
                    <option value="Analista de Qualidade (QA)">Analista de Qualidade (QA)</option>
                    <option value="Analista de Recrutamento e Seleção">Analista de Recrutamento e Seleção</option>
                    <option value="Especialista em Treinamento e Desenvolvimento">Especialista em Treinamento e Desenvolvimento</option>
                    <option value="Coordenador(a) de Projetos">Coordenador(a) de Projetos</option>
                    <option value="Gerente de Operações">Gerente de Operações</option>
                </select>
            </div>

            <div class="field-group">
                <label for="dataAdmissao">Data de Admissão</label>
                <input type="date" id="dataAdmissao" required>
            </div>

            <div class="field-group">
                <label for="dataFerias">
                    Data de Férias
                    <span class="opcional">(opcional)</span>
                </label>

                <input type="date" id="dataFerias">
            </div>

            <span class="section-label">
                Acesso ao Sistema
            </span>

            <div class="field-group">
                <label for="perfil">Perfil de Acesso</label>

                <select id="perfil">
                    <option value="funcionario">Funcionário</option>
                    <option value="rh">RH</option>
                </select>
            </div>

            <div class="field-group">
                <label for="senha">
                    Nova Senha
                    <span class="opcional">
                        (deixe em branco para manter)
                    </span>
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="••••••••"
                >
            </div>

        </div>

        <div class="form-footer">

            <button
                type="button"
                id="btnExcluir"
            >
                Excluir Funcionário
            </button>

            <button type="submit">
                Salvar Alterações
            </button>

        </div>

    </form>

    <p id="mensagem"></p>
    <script defer src="../js/navegacao.js"></script>
    <script defer src="../js/editarFuncionario.js"></script>
    <script defer src="../js/carregarMenu.js"></script>
    <script defer src="../js/auth.js"></script>

</body>
</html>
